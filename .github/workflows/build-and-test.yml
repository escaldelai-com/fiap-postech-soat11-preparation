name: Build and Test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Restaurant.Preparation.slnx

      - name: Build Web API project
        run: dotnet build Restaurant.Preparation.slnx --configuration Release --no-restore

      - name: Run model tests
        run: dotnet test Restaurant.Preparation.Domain.Test/Restaurant.Preparation.Domain.Test.csproj --configuration Release --no-build

      - name: Run application tests
        run: dotnet test Restaurant.Preparation.Application.Test/Restaurant.Preparation.Application.Test.csproj --configuration Release --no-build